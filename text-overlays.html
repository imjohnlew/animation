<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Overlays &amp; Comedic Inserts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05050f;
    color: #e0e0e0;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Vignette overlay */
  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
    z-index: 1000;
  }

  /* Main stage */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #shake-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* Scene containers */
  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .scene.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  /* ===== TIMER ===== */
  #timer {
    position: fixed;
    top: 18px;
    left: 22px;
    font-size: 14px;
    color: #c8a94e;
    font-family: 'Courier New', monospace;
    z-index: 900;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  /* ===== CONTROLS ===== */
  #controls {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 900;
  }
  #controls button {
    background: rgba(200, 169, 78, 0.12);
    border: 1px solid rgba(200, 169, 78, 0.35);
    color: #c8a94e;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    font-family: inherit;
  }
  #controls button:hover {
    background: rgba(200, 169, 78, 0.25);
    border-color: #c8a94e;
  }
  #controls button.active-btn {
    background: rgba(200, 169, 78, 0.3);
    border-color: #c8a94e;
    color: #fff;
  }

  /* ===== SCENE 1: Rate Cut Stamp ===== */
  #scene1 .stamp-text {
    font-size: 120px;
    font-weight: 900;
    color: #e63946;
    text-shadow: 0 0 30px rgba(230, 57, 70, 0.5);
    position: relative;
    z-index: 10;
    transform: scale(3);
    opacity: 0;
  }
  #scene1 .stamp-border {
    position: absolute;
    border: 6px solid #e63946;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(230, 57, 70, 0.4), inset 0 0 25px rgba(230, 57, 70, 0.1);
    opacity: 0;
    width: 340px;
    height: 200px;
    z-index: 9;
  }
  #scene1 .stamp-subtitle {
    font-size: 26px;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 24px;
    opacity: 0;
    letter-spacing: 4px;
  }
  #scene1 .impact-flash {
    position: absolute;
    inset: 0;
    background: rgba(230, 57, 70, 0.25);
    opacity: 0;
    z-index: 8;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c8a94e;
    pointer-events: none;
    z-index: 11;
    opacity: 0;
  }

  /* ===== SCENE 2: Balance Sheet Reduction ===== */
  #scene2 .sweep-panel {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%) scaleX(0);
    transform-origin: left center;
    width: 100%;
    height: 220px;
    background: linear-gradient(90deg, #1b2b80, #0f1a50);
    z-index: 5;
    opacity: 0;
  }
  #scene2 .main-text {
    font-size: 110px;
    font-weight: 900;
    color: #ffffff;
    position: relative;
    z-index: 10;
    opacity: 0;
    filter: blur(30px);
    text-shadow: 0 0 20px rgba(100, 140, 255, 0.5);
  }
  #scene2 .warning-icon {
    font-size: 52px;
    margin-bottom: 16px;
    opacity: 0;
    z-index: 10;
  }
  #scene2 .subtitle-line {
    font-size: 22px;
    color: rgba(200, 210, 255, 0.8);
    margin-top: 18px;
    opacity: 0;
    letter-spacing: 2px;
    z-index: 10;
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid rgba(200, 210, 255, 0.8);
    width: 0;
  }
  #scene2 .glitch-layer {
    position: absolute;
    font-size: 110px;
    font-weight: 900;
    color: #00ffff;
    z-index: 9;
    opacity: 0;
    pointer-events: none;
  }
  #scene2 .glitch-layer.red {
    color: #ff0040;
  }

  @keyframes warningPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  @keyframes cursorBlink {
    0%, 100% { border-color: rgba(200, 210, 255, 0.8); }
    50% { border-color: transparent; }
  }

  /* ===== SCENE 3: Meme Image Overlay ===== */
  #scene3 .meme-frame {
    width: 340px;
    height: 280px;
    border: 3px solid #c8a94e;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 10;
    background: rgba(200, 169, 78, 0.05);
    box-shadow: 0 0 40px rgba(200, 169, 78, 0.25), 0 0 80px rgba(200, 169, 78, 0.1);
    transform: scale(0);
    overflow: hidden;
  }
  #scene3 .meme-placeholder {
    width: 90%;
    height: 85%;
    background: linear-gradient(135deg, #2a2a4a, #1a1a35);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }
  #scene3 .meme-placeholder .emoji {
    font-size: 56px;
  }
  #scene3 .meme-placeholder .label {
    font-size: 28px;
    font-weight: 700;
    color: #c8a94e;
    letter-spacing: 4px;
  }
  #scene3 .meme-caption {
    font-size: 22px;
    color: #e0e0e0;
    margin-top: 22px;
    opacity: 0;
    transform: translateY(30px);
    z-index: 10;
    text-align: center;
    line-height: 1.5;
  }
  #scene3 .gold-glow-ring {
    position: absolute;
    width: 380px;
    height: 320px;
    border-radius: 20px;
    border: 2px solid transparent;
    box-shadow: 0 0 50px rgba(200, 169, 78, 0.3);
    z-index: 9;
    opacity: 0;
  }

  @keyframes rubberBand {
    0% { transform: scale(1); }
    30% { transform: scaleX(1.12) scaleY(0.88); }
    40% { transform: scaleX(0.88) scaleY(1.12); }
    50% { transform: scaleX(1.06) scaleY(0.94); }
    65% { transform: scaleX(0.97) scaleY(1.03); }
    75% { transform: scaleX(1.02) scaleY(0.98); }
    100% { transform: scale(1); }
  }

  @keyframes goldPulseGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(200, 169, 78, 0.2), 0 0 60px rgba(200, 169, 78, 0.08); }
    50% { box-shadow: 0 0 50px rgba(200, 169, 78, 0.4), 0 0 90px rgba(200, 169, 78, 0.15); }
  }

  /* ===== SCENE 4: Key Number Pop ===== */
  #scene4 .number-container {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 0;
  }
  #scene4 .digit {
    font-size: 130px;
    font-weight: 900;
    background: linear-gradient(180deg, #ffd700, #c8a94e, #b8860b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    transform: scale(0.1);
    display: inline-block;
    filter: drop-shadow(0 0 15px rgba(200, 169, 78, 0.6));
  }
  #scene4 .label-zh {
    font-size: 32px;
    color: #c8a94e;
    margin-top: 20px;
    opacity: 0;
    transform: translateY(40px);
    z-index: 10;
    letter-spacing: 6px;
  }
  #scene4 .label-en {
    font-size: 20px;
    color: rgba(200, 169, 78, 0.65);
    margin-top: 10px;
    opacity: 0;
    z-index: 10;
    letter-spacing: 3px;
  }
  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ffd700;
    border-radius: 50%;
    pointer-events: none;
    z-index: 11;
    opacity: 0;
  }

  @keyframes numberPulseGlow {
    0%, 100% { filter: drop-shadow(0 0 15px rgba(200, 169, 78, 0.5)); }
    50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 60px rgba(200, 169, 78, 0.3)); }
  }

  @keyframes floatSlight {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Scene indicator dots */
  #scene-dots {
    position: fixed;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 900;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(200, 169, 78, 0.25);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active {
    background: #c8a94e;
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div id="vignette"></div>

<div id="timer">00:00.0</div>

<div id="stage">
  <div id="shake-wrapper">

    <!-- SCENE 1: Rate Cut Stamp -->
    <div id="scene1" class="scene active">
      <div class="impact-flash"></div>
      <div class="stamp-border"></div>
      <div class="stamp-text">降息</div>
      <div class="stamp-subtitle">Interest Rate Cut</div>
      <!-- particles injected by JS -->
    </div>

    <!-- SCENE 2: Balance Sheet Reduction -->
    <div id="scene2" class="scene">
      <div class="sweep-panel"></div>
      <div class="warning-icon">⚠️</div>
      <div class="glitch-layer cyan">缩表</div>
      <div class="glitch-layer red">缩表</div>
      <div class="main-text">缩表</div>
      <div class="subtitle-line">Balance Sheet Reduction</div>
    </div>

    <!-- SCENE 3: Meme Image Overlay -->
    <div id="scene3" class="scene">
      <div class="gold-glow-ring"></div>
      <div class="meme-frame">
        <div class="meme-placeholder">
          <span class="emoji">🖼️</span>
          <span class="label">MEME</span>
        </div>
      </div>
      <div class="meme-caption">当散户听到利好消息<br><span style="font-size:16px;color:rgba(200,169,78,0.6);">When retail investors hear good news</span></div>
    </div>

    <!-- SCENE 4: Key Number Pop -->
    <div id="scene4" class="scene">
      <div class="number-container">
        <span class="digit">$</span><span class="digit">3</span><span class="digit">,</span><span class="digit">1</span><span class="digit">0</span><span class="digit">0</span>
      </div>
      <div class="label-zh">黄金历史新高</div>
      <div class="label-en">Historical Record!</div>
    </div>

  </div>
</div>

<div id="scene-dots">
  <div class="dot active" data-scene="0"></div>
  <div class="dot" data-scene="1"></div>
  <div class="dot" data-scene="2"></div>
  <div class="dot" data-scene="3"></div>
</div>

<div id="controls">
  <button id="btn-prev">◀ Prev</button>
  <button id="btn-restart">↻ Restart</button>
  <button id="btn-pause">⏸ Pause</button>
  <button id="btn-next">Next ▶</button>
</div>

<script>
(function() {
  // ======== State ========
  let currentScene = 0;
  const totalScenes = 4;
  let masterTL = null;
  let isPaused = false;
  let timerStart = Date.now();
  let timerRAF = null;

  const scenes = [
    document.getElementById('scene1'),
    document.getElementById('scene2'),
    document.getElementById('scene3'),
    document.getElementById('scene4')
  ];
  const dots = document.querySelectorAll('.dot');
  const shakeWrapper = document.getElementById('shake-wrapper');

  // ======== Timer ========
  const timerEl = document.getElementById('timer');
  function updateTimer() {
    if (!isPaused) {
      const elapsed = Date.now() - timerStart;
      const mins = String(Math.floor(elapsed / 60000)).padStart(2, '0');
      const secs = String(Math.floor((elapsed % 60000) / 1000)).padStart(2, '0');
      const tenths = String(Math.floor((elapsed % 1000) / 100));
      timerEl.textContent = `${mins}:${secs}.${tenths}`;
    }
    timerRAF = requestAnimationFrame(updateTimer);
  }
  updateTimer();

  // ======== Utility: Screen Shake ========
  function screenShake(duration, intensity) {
    const tl = gsap.timeline();
    const steps = Math.floor(duration / 0.03);
    for (let i = 0; i < steps; i++) {
      const x = (Math.random() - 0.5) * 2 * intensity;
      const y = (Math.random() - 0.5) * 2 * intensity;
      tl.to(shakeWrapper, { x, y, duration: 0.03 });
    }
    tl.to(shakeWrapper, { x: 0, y: 0, duration: 0.05 });
    return tl;
  }

  // ======== Utility: Create Particles ========
  function createImpactParticles(container, count, color, originX, originY) {
    const particles = [];
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = color || '#c8a94e';
      p.style.left = '50%';
      p.style.top = '50%';
      const size = 3 + Math.random() * 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      container.appendChild(p);
      particles.push(p);
    }
    return particles;
  }

  function animateParticlesOut(particles, spread) {
    const tl = gsap.timeline();
    particles.forEach(p => {
      const angle = Math.random() * Math.PI * 2;
      const dist = spread * (0.4 + Math.random() * 0.6);
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      tl.to(p, {
        x: dx, y: dy,
        opacity: 1,
        duration: 0.05
      }, 0);
      tl.to(p, {
        x: dx * 2.5, y: dy * 2.5 + 40,
        opacity: 0,
        duration: 0.6 + Math.random() * 0.4,
        ease: 'power2.out'
      }, 0.05);
    });
    return tl;
  }

  // ======== Utility: Sparkles (Scene 4) ========
  function createSparkles(container, count) {
    const sparkles = [];
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = (20 + Math.random() * 60) + '%';
      s.style.top = (30 + Math.random() * 30) + '%';
      container.appendChild(s);
      sparkles.push(s);
    }
    return sparkles;
  }

  function animateSparklesContinuous(sparkles) {
    sparkles.forEach((s, i) => {
      gsap.to(s, {
        opacity: 1,
        scale: 1 + Math.random() * 2,
        duration: 0.3,
        delay: i * 0.05,
        repeat: -1,
        yoyo: true,
        repeatDelay: 0.3 + Math.random() * 0.8,
        ease: 'power1.inOut'
      });
      gsap.to(s, {
        y: -(10 + Math.random() * 30),
        x: (Math.random() - 0.5) * 20,
        duration: 1 + Math.random(),
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });
    });
  }

  // ======== Cleanup particles/sparkles ========
  function cleanupDynamic(container) {
    container.querySelectorAll('.particle, .sparkle').forEach(el => el.remove());
  }

  // ======== Scene Builders ========

  function buildScene1() {
    const s = scenes[0];
    cleanupDynamic(s);
    const stampText = s.querySelector('.stamp-text');
    const border = s.querySelector('.stamp-border');
    const subtitle = s.querySelector('.stamp-subtitle');
    const flash = s.querySelector('.impact-flash');

    gsap.set(stampText, { scale: 3, opacity: 0 });
    gsap.set(border, { opacity: 0, scale: 1.5 });
    gsap.set(subtitle, { opacity: 0, y: 15 });
    gsap.set(flash, { opacity: 0 });

    const particles = createImpactParticles(s, 28, '#c8a94e');

    const tl = gsap.timeline();

    // Stamp in with bounce
    tl.to(stampText, {
      scale: 1, opacity: 1,
      duration: 0.35,
      ease: 'back.out(3)'
    }, 0.3);

    // Impact flash
    tl.to(flash, { opacity: 1, duration: 0.06 }, 0.55);
    tl.to(flash, { opacity: 0, duration: 0.2 }, 0.61);

    // Screen shake on impact
    tl.add(screenShake(0.3, 12), 0.55);

    // Border appears
    tl.to(border, {
      opacity: 1, scale: 1,
      duration: 0.3,
      ease: 'back.out(2)'
    }, 0.6);

    // Particles burst
    tl.add(animateParticlesOut(particles, 250), 0.55);

    // Subtitle fades in
    tl.to(subtitle, {
      opacity: 1, y: 0,
      duration: 0.5,
      ease: 'power2.out'
    }, 1.0);

    return tl;
  }

  function buildScene2() {
    const s = scenes[1];
    const panel = s.querySelector('.sweep-panel');
    const mainText = s.querySelector('.main-text');
    const warning = s.querySelector('.warning-icon');
    const subtitle = s.querySelector('.subtitle-line');
    const glitchCyan = s.querySelector('.glitch-layer.cyan');
    const glitchRed = s.querySelector('.glitch-layer.red');

    gsap.set(panel, { scaleX: 0, opacity: 0 });
    gsap.set(mainText, { x: 300, opacity: 0, filter: 'blur(30px)' });
    gsap.set(warning, { opacity: 0, scale: 0.5 });
    gsap.set(subtitle, { width: 0, opacity: 0 });
    gsap.set([glitchCyan, glitchRed], { opacity: 0 });

    const tl = gsap.timeline();

    // Panel sweeps in from left
    tl.to(panel, {
      scaleX: 1, opacity: 1,
      duration: 0.5,
      ease: 'power3.out'
    }, 0.2);

    // Text slides from right with motion blur
    tl.to(mainText, {
      x: 0, opacity: 1, filter: 'blur(0px)',
      duration: 0.5,
      ease: 'power3.out'
    }, 0.4);

    // Glitch flicker
    tl.to(glitchCyan, { opacity: 0.7, x: -4, y: 2, duration: 0.04 }, 0.95);
    tl.to(glitchRed, { opacity: 0.7, x: 4, y: -2, duration: 0.04 }, 0.95);
    tl.to(glitchCyan, { opacity: 0, duration: 0.04 }, 1.0);
    tl.to(glitchRed, { opacity: 0, duration: 0.04 }, 1.0);
    tl.to(glitchCyan, { opacity: 0.5, x: 3, y: -1, duration: 0.03 }, 1.08);
    tl.to(glitchRed, { opacity: 0.5, x: -3, y: 1, duration: 0.03 }, 1.08);
    tl.to(glitchCyan, { opacity: 0, duration: 0.04 }, 1.14);
    tl.to(glitchRed, { opacity: 0, duration: 0.04 }, 1.14);
    tl.to(glitchCyan, { opacity: 0.3, x: -2, duration: 0.03 }, 1.22);
    tl.to(glitchRed, { opacity: 0.3, x: 2, duration: 0.03 }, 1.22);
    tl.to([glitchCyan, glitchRed], { opacity: 0, duration: 0.05 }, 1.28);

    // Warning icon
    tl.to(warning, {
      opacity: 1, scale: 1,
      duration: 0.3,
      ease: 'back.out(2)'
    }, 1.1);

    // After appearing, pulse continuously
    tl.call(() => {
      warning.style.animation = 'warningPulse 1s ease-in-out infinite';
    }, null, 1.45);

    // Typing subtitle
    const subtitleText = 'Balance Sheet Reduction';
    tl.to(subtitle, { opacity: 1, duration: 0.01 }, 1.3);
    tl.to(subtitle, {
      width: (subtitleText.length * 13.5) + 'px',
      duration: 1.2,
      ease: 'steps(' + subtitleText.length + ')'
    }, 1.3);
    tl.call(() => {
      subtitle.style.animation = 'cursorBlink 0.7s step-end infinite';
    }, null, 2.5);

    return tl;
  }

  function buildScene3() {
    const s = scenes[2];
    const frame = s.querySelector('.meme-frame');
    const caption = s.querySelector('.meme-caption');
    const glowRing = s.querySelector('.gold-glow-ring');

    gsap.set(frame, { scale: 0 });
    gsap.set(caption, { opacity: 0, y: 30 });
    gsap.set(glowRing, { opacity: 0 });

    const tl = gsap.timeline();

    // Frame pops in
    tl.to(frame, {
      scale: 1,
      duration: 0.45,
      ease: 'back.out(3)'
    }, 0.3);

    // Gold glow ring
    tl.to(glowRing, {
      opacity: 1,
      duration: 0.3
    }, 0.5);

    tl.call(() => {
      glowRing.style.animation = 'goldPulseGlow 2s ease-in-out infinite';
    }, null, 0.8);

    // RubberBand wobble
    tl.call(() => {
      frame.style.animation = 'rubberBand 0.8s ease';
      setTimeout(() => { frame.style.animation = ''; }, 850);
    }, null, 0.8);

    // Caption slides up with bounce
    tl.to(caption, {
      opacity: 1, y: 0,
      duration: 0.5,
      ease: 'back.out(2)'
    }, 1.2);

    // Gentle float after settling
    tl.call(() => {
      frame.style.animation = 'floatSlight 3s ease-in-out infinite';
    }, null, 2.0);

    return tl;
  }

  function buildScene4() {
    const s = scenes[3];
    cleanupDynamic(s);
    const digits = s.querySelectorAll('.digit');
    const labelZh = s.querySelector('.label-zh');
    const labelEn = s.querySelector('.label-en');

    gsap.set(digits, { scale: 0.1, opacity: 0 });
    gsap.set(labelZh, { opacity: 0, y: 40 });
    gsap.set(labelEn, { opacity: 0 });

    const sparkles = createSparkles(s, 24);
    const tl = gsap.timeline();

    // Digits stagger in
    digits.forEach((d, i) => {
      tl.to(d, {
        scale: 1, opacity: 1,
        duration: 0.35,
        ease: 'back.out(3)'
      }, 0.3 + i * 0.1);
    });

    // Sparkles after digits land
    tl.call(() => {
      animateSparklesContinuous(sparkles);
    }, null, 1.0);

    // Chinese label slides up
    tl.to(labelZh, {
      opacity: 1, y: 0,
      duration: 0.5,
      ease: 'back.out(2)'
    }, 1.2);

    // English label fades
    tl.to(labelEn, {
      opacity: 1,
      duration: 0.6
    }, 1.6);

    // Continuous golden pulse on digits
    tl.call(() => {
      digits.forEach(d => {
        d.style.animation = 'numberPulseGlow 2s ease-in-out infinite';
      });
    }, null, 2.0);

    return tl;
  }

  const sceneBuilders = [buildScene1, buildScene2, buildScene3, buildScene4];

  // ======== Scene Switching ========
  function showScene(index) {
    // Kill old timeline
    if (masterTL) {
      masterTL.kill();
      masterTL = null;
    }
    gsap.killTweensOf('*');

    // Clean up CSS animations
    scenes.forEach(s => {
      s.querySelectorAll('*').forEach(el => {
        el.style.animation = '';
      });
    });

    // Toggle active
    scenes.forEach((s, i) => {
      s.classList.toggle('active', i === index);
    });
    dots.forEach((d, i) => {
      d.classList.toggle('active', i === index);
    });

    currentScene = index;
    isPaused = false;
    timerStart = Date.now();
    document.getElementById('btn-pause').textContent = '⏸ Pause';

    // Build and play
    masterTL = sceneBuilders[index]();
  }

  // ======== Controls ========
  document.getElementById('btn-prev').addEventListener('click', () => {
    showScene((currentScene - 1 + totalScenes) % totalScenes);
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    showScene((currentScene + 1) % totalScenes);
  });
  document.getElementById('btn-restart').addEventListener('click', () => {
    showScene(currentScene);
  });
  document.getElementById('btn-pause').addEventListener('click', function() {
    if (!masterTL) return;
    if (isPaused) {
      gsap.globalTimeline.resume();
      isPaused = false;
      this.textContent = '⏸ Pause';
    } else {
      gsap.globalTimeline.pause();
      isPaused = true;
      this.textContent = '▶ Resume';
    }
  });

  dots.forEach(d => {
    d.addEventListener('click', () => {
      showScene(parseInt(d.dataset.scene));
    });
  });

  // Keyboard nav
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      showScene((currentScene + 1) % totalScenes);
    } else if (e.key === 'ArrowLeft') {
      showScene((currentScene - 1 + totalScenes) % totalScenes);
    } else if (e.key === 'r' || e.key === 'R') {
      showScene(currentScene);
    }
  });

  // ======== Init ========
  showScene(0);

})();
</script>
</body>
</html>
